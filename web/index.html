<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Monolith — build your own silhouette.">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="module" src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>

  <!--
    Warm the 3D assets while Flutter boots. <model-viewer> only requests its
    GLB once the Flutter view has rendered, so without this every model load
    starts from zero after startup. Paths use the assets/assets/... form that
    `flutter build web` emits (see SneakerViewer). crossorigin is required so
    the preloaded response matches three.js's fetch() (cors, same-origin
    credentials) and gets reused instead of downloaded twice.

    The hero model (gold, above the fold on Home) is preloaded at high
    priority; the rest are ~60-80 MB each, so they're only prefetched at idle
    priority to avoid starving main.dart.js / CanvasKit.
  -->
  <link rel="modulepreload" href="./assets/packages/model_viewer_plus/assets/model-viewer.min.js">
  <link rel="preload" href="assets/assets/models/gold.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous">
  <link rel="prefetch" href="assets/assets/models/blue.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous">
  <link rel="prefetch" href="assets/assets/models/red.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="monolith">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Monolith</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
